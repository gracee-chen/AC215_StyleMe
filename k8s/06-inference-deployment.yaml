---
# Inference Deployment - Long-running service that serves the API
# This is a Deployment (not Job) because it needs to run continuously
apiVersion: apps/v1
kind: Deployment
metadata:
  name: styleme-inference
  namespace: default
  labels:
    app: styleme
    component: inference
spec:
  replicas: 1  # Start with 1 replica (PVC is ReadWriteOnce, can't share between pods)
  selector:
    matchLabels:
      app: styleme
      component: inference
  template:
    metadata:
      labels:
        app: styleme
        component: inference
    spec:
      serviceAccountName: styleme-workload-identity
      containers:
      - name: inference
        image: us-central1-docker.pkg.dev/styleme-475201/styleme-repo/styleme-inference:latest  # You'll need to build and push this image
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: styleme-config
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        volumeMounts:
        - name: shared-data
          mountPath: /app/data
        - name: experiments
          mountPath: /app/experiments
        - name: catalog
          mountPath: /app/catalog
        - name: wardrobes
          mountPath: /app/wardrobes
        - name: queries
          mountPath: /app/queries
        - name: results
          mountPath: /app/results
        - name: logs
          mountPath: /app/logs
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"  # Reduced to fit available resources
          limits:
            memory: "2Gi"
            cpu: "1000m"  # Reduced to fit available resources
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: shared-data
        persistentVolumeClaim:
          claimName: styleme-data-pvc
      - name: experiments
        persistentVolumeClaim:
          claimName: styleme-data-pvc
      - name: catalog
        persistentVolumeClaim:
          claimName: styleme-data-pvc
      - name: wardrobes
        persistentVolumeClaim:
          claimName: styleme-data-pvc
      - name: queries
        persistentVolumeClaim:
          claimName: styleme-data-pvc
      - name: results
        persistentVolumeClaim:
          claimName: styleme-data-pvc
      - name: logs
        emptyDir: {}

---
# Service to expose the inference deployment
apiVersion: v1
kind: Service
metadata:
  name: styleme-inference-service
  namespace: default
  labels:
    app: styleme
    component: inference
spec:
  type: LoadBalancer  # Use LoadBalancer for public access (GCP will create external IP)
  # Alternative: Use NodePort for simpler setup, or ClusterIP + Ingress
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: styleme
    component: inference
  # Session affinity for stateful connections (optional)
  sessionAffinity: None

