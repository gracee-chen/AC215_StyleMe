---
# ConfigMap for shared environment variables
# This contains non-sensitive configuration that all services need
apiVersion: v1
kind: ConfigMap
metadata:
  name: styleme-config
  namespace: default
  labels:
    app: styleme
data:
  # GCP Configuration
  GCP_BUCKET_NAME: "styleme-data-bucket"
  GCS_BUCKET: "styleme-production"
  GCP_PROJECT_ID: "styleme-475201"
  DATA_PREFIX: "json"
  IMAGES_PREFIX: "images"
  
  # Logging
  LOG_LEVEL: "INFO"
  
  # Data directories (shared across containers)
  # NOTE: Using GCS paths for experiments, catalog, wardrobes since models come from Vertex AI
  DATA_DIR: "/app/data"
  EXPERIMENTS_DIR: "/gcs/styleme-production/experiments"
  CATALOG_DIR: "/gcs/styleme-production/catalog"
  WARDROBES_DIR: "/gcs/styleme-production/wardrobes"
  QUERIES_DIR: "/gcs/styleme-production/queries"
  RESULTS_DIR: "/gcs/styleme-production/results"
  LOGS_DIR: "/app/logs"
  
  # Inference service specific
  PORT: "5000"
  FLASK_DEBUG: "false"
  UPLOAD_FOLDER: "/app/uploads"
  RUN_API_SERVER: "true"
  
  # Training specific
  CUDA_VISIBLE_DEVICES: "0"

