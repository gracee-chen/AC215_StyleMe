services:
  # Data Ingestion Service
  ingestion:
    build:
      context: .
      dockerfile: containers/ingestion/Dockerfile
    container_name: styleme-ingestion
    volumes:
      - ./logs:/app/logs
    environment:
      - GCP_BUCKET_NAME=styleme-data-bucket
      - GCP_PROJECT_ID=styleme-475201
      - DATA_PREFIX=json
      - IMAGES_PREFIX=images
      - LOG_LEVEL=INFO
    profiles:
      - pipeline
      - ingestion
    networks:
      - styleme-network

  # Data Preprocessing Service
  preprocessing:
    build:
      context: .
      dockerfile: containers/preprocessing/Dockerfile
    container_name: styleme-preprocessing
    volumes:
      - ./logs:/app/logs
    environment:
      - GCP_BUCKET_NAME=styleme-data-bucket
      - GCP_PROJECT_ID=styleme-475201
      - DATA_PREFIX=json
      - IMAGES_PREFIX=images
      - LOG_LEVEL=INFO
    depends_on:
      - ingestion
    profiles:
      - pipeline
      - preprocessing
    networks:
      - styleme-network

  # Model Training Service
  training:
    build:
      context: .
      dockerfile: containers/training/Dockerfile
    container_name: styleme-training
    volumes:
      - ./src/models/train/experiments:/app/experiments
      - ./logs:/app/logs
    environment:
      - GCP_BUCKET_NAME=styleme-data-bucket
      - GCP_PROJECT_ID=styleme-475201
      - DATA_PREFIX=json
      - IMAGES_PREFIX=images
      - EXPERIMENTS_DIR=/app/experiments
      - CUDA_VISIBLE_DEVICES=0
      - LOG_LEVEL=INFO
    shm_size: 2gb  # Increase shared memory to avoid DataLoader issues
    depends_on:
      - preprocessing
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - pipeline
      - training
    networks:
      - styleme-network

  # Inference Service
  inference:
    build:
      context: .
      dockerfile: containers/inference/Dockerfile
    container_name: styleme-inference
    volumes:
      - ./src/models/train/experiments:/app/experiments
      - ./catalog:/app/catalog
      - ./wardrobes:/app/wardrobes
      - ./queries:/app/queries
      - ./results:/app/results
      - ./logs:/app/logs
      # Mount gcloud credentials for GCS access (uses your user credentials)
      - ~/.config/gcloud:/root/.config/gcloud:ro
      # Alternative: Mount service account key file if you prefer (uncomment and place gcs-credentials.json in project root)
      # - ./gcs-credentials.json:/app/gcs-credentials.json:ro
    environment:
      - GCP_BUCKET_NAME=styleme-data-bucket
      - GCP_PROJECT_ID=styleme-475201
      - GCS_BUCKET=styleme-production
      - DATA_PREFIX=json
      - IMAGES_PREFIX=images
      - EXPERIMENTS_DIR=/gcs/styleme-production/experiments
      - CATALOG_DIR=/gcs/styleme-production/catalog
      - WARDROBES_DIR=/gcs/styleme-production/wardrobes
      - QUERIES_DIR=/gcs/styleme-production/queries
      - RESULTS_DIR=/gcs/styleme-production/results
      - LOGS_DIR=/app/logs
      - LOG_LEVEL=INFO
      - RUN_API_SERVER=true
      - PORT=5000
      - FLASK_DEBUG=false
    ports:
      - "5001:5000"
    profiles:
      - pipeline
      - inference
      - api
    networks:
      - styleme-network

networks:
  styleme-network:
    driver: bridge

volumes:
  data:
  experiments:
  logs:
  catalog:
  wardrobes:
  queries:
  results:
