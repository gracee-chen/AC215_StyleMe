name: Continuous Integration and Testing

on:
  push:
    branches: [ main, master, develop, milestone* ]
  pull_request:
    branches: [ main, master, develop, milestone* ]

jobs:
  build-and-lint:
    name: Build and Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Clean up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        df -h
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Install exact compatible versions FIRST (tested stable - avoids register_pytree_node error)
        pip install "torch==2.1.2" "torchvision==0.16.2" "numpy==1.26.4" "transformers==4.35.2"
        # Install CI dependencies (will use already installed compatible versions)
        pip install -r CI/requirements-dev.txt
        # Install project dependencies (will skip already installed packages)
        pip install -r containers/training/requirements.txt || true
        pip install -r containers/inference/requirements.txt || true
        pip install -r containers/preprocessing/requirements.txt || true
        # Verify versions
        python -c "import numpy; import torch; import transformers; print(f'✅ NumPy: {numpy.__version__}'); print(f'✅ PyTorch: {torch.__version__}'); print(f'✅ Transformers: {transformers.__version__}')"
        # Clean pip cache to save space
        pip cache purge || true
    
    - name: Run Flake8 linting
      run: |
        flake8 src/ containers/ scripts/ --config=CI/config/.flake8 --exclude=containers/inference/build_catalog_index.py
      continue-on-error: false
    
    - name: Check code formatting
      run: |
        flake8 --statistics --count src/ containers/ scripts/ --config=CI/config/.flake8 --exclude=containers/inference/build_catalog_index.py

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Clean up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        df -h
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Install exact compatible versions FIRST (tested stable - avoids register_pytree_node error)
        pip install "torch==2.1.2" "torchvision==0.16.2" "numpy==1.26.4" "transformers==4.35.2" "huggingface-hub>=0.20.0,<0.22.0"
        # Install CI dependencies with NumPy constraint
        pip install -r CI/requirements-dev.txt --constraint <(echo "numpy<2.0.0")
        # Install project dependencies with NumPy constraint (prevent NumPy 2.x upgrade)
        pip install -r containers/training/requirements.txt --constraint <(echo "numpy<2.0.0") || true
        pip install -r containers/inference/requirements.txt --constraint <(echo "numpy<2.0.0") || true
        pip install -r containers/preprocessing/requirements.txt --constraint <(echo "numpy<2.0.0") || true
        # Verify versions and enforce NumPy < 2.0
        python -c "import numpy; import torch; import transformers; assert numpy.__version__.startswith('1.'), f'NumPy version {numpy.__version__} is >= 2.0!'; print(f'✅ NumPy: {numpy.__version__}'); print(f'✅ PyTorch: {torch.__version__}'); print(f'✅ Transformers: {transformers.__version__}')"
        # Clean pip cache to save space
        pip cache purge || true
    
    - name: Run unit tests
      run: |
        cd /home/runner/work/AC215_StyleMe/AC215_StyleMe || cd $GITHUB_WORKSPACE
        python -c "import sys; print('Python path:', sys.path[:3])"
        python -c "import os; print('Working dir:', os.getcwd())"
        pytest CI/tests/ -m unit -v --tb=short -c CI/config/pytest.ini --rootdir=.
    
    - name: Run integration tests
      run: |
        pytest CI/tests/integration/ -m integration -v --tb=short
    
    - name: Run end-to-end tests
      run: |
        pytest CI/tests/test_e2e.py -m e2e -v --tb=short
      continue-on-error: true  # E2E tests may be flaky
    
    - name: Run all tests with coverage
      run: |
        pytest CI/tests/ \
          --cov=src \
          --cov=containers \
          --cov-config=CI/config/.coveragerc \
          --cov-report=term-missing \
          --cov-report=xml:CI/coverage.xml \
          --cov-report=html:CI/coverage_html \
          --cov-fail-under=50 \
          -v

  coverage:
    name: Report Coverage
    runs-on: ubuntu-latest
    needs: [build-and-lint, test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r CI/requirements-dev.txt
        pip install -r containers/training/requirements.txt || true
    
    - name: Generate coverage report
      run: |
        pytest CI/tests/ \
          --cov=src \
          --cov=containers \
          --cov-config=CI/config/.coveragerc \
          --cov-report=term \
          --cov-report=xml:CI/coverage.xml \
          --cov-report=html:CI/coverage_html \
          --cov-fail-under=50 \
          -v \
          --tb=short
    
    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: |
          CI/coverage.xml
          CI/coverage_html/
    
    - name: Coverage summary
      run: |
        echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Coverage reports generated:" >> $GITHUB_STEP_SUMMARY
        echo "- XML: CI/coverage.xml" >> $GITHUB_STEP_SUMMARY
        echo "- HTML: CI/coverage_html/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Minimum coverage requirement: **50%**" >> $GITHUB_STEP_SUMMARY

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build-and-lint, test, coverage]
    if: always()
    
    steps:
    - name: CI Status
      run: |
        echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Build and Lint: ${{ needs.build-and-lint.result }}" >> $GITHUB_STEP_SUMMARY
        echo "✅ Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "✅ Coverage: ${{ needs.coverage.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "All checks must pass for merge." >> $GITHUB_STEP_SUMMARY

