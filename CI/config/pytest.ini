[pytest]
# Pytest configuration for StyleMe CI
testpaths = CI/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov=containers
    --cov-report=term-missing
    --cov-report=html:CI/coverage_html
    --cov-report=xml:CI/coverage.xml
    --cov-fail-under=50
    --ignore=CI/tests/fixtures
markers =
    unit: Unit tests for individual functions/classes
    integration: Integration tests for multiple modules
    e2e: End-to-end tests for full pipeline
    slow: Tests that take a long time to run
    gpu: Tests that require GPU
    docker: Tests that require Docker

