steps:
  # Build training container for linux/amd64 (required for Vertex AI)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--platform'
      - 'linux/amd64'
      - '-f'
      - 'containers/training/Dockerfile'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/styleme-repo/training:latest'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/styleme-repo/training:$SHORT_SHA'
      - '.'
    
  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/styleme-repo/training'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '3600s'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/styleme-repo/training:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/styleme-repo/training:$SHORT_SHA'

